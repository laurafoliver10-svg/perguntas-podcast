<html style="margin:0;padding:0;">
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
(function(){
  var s = document.createElement('style');
  s.textContent = ':root{--bg:#fdf9fb;--card:#ffffff;--text:#0f172a;--muted:#64748b;--accent:#dc2626;--accent-soft:rgba(220,38,38,.12);--border:rgba(15,23,42,.1)}.btn-primary{transition:all .2s ease}.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(220,38,38,.25)}.btn-primary:active{transform:translateY(0)}.btn-primary:disabled{opacity:.6;cursor:not-allowed;transform:none}.bg-pattern{background-image:url("https://p16-flow-image-sign.ibyteimg.com/tos-mya-i-3rsxbfecgb/rc_gen_image/0690cf70baae403abf3728bebaf2d797.jpeg~tplv-0es2k971ck-image.image?rcl=202608271000279916EDED04D0B946006A&rk3s=8e244e95&rrcfp=02a80fc2&x-expires=1790388114&x-signature=WEe%2B6kd0A%2FcnI3EdEiqWGQilMko%3D");background-size:cover;background-position:center;background-attachment:fixed}.overlay{background:rgba(255,255,255,0.92);backdrop-filter:blur(2px)}textarea:focus,input:focus{outline:none;box-shadow:0 0 0 3px var(--accent-soft)}';
  document.head.appendChild(s);
})();
</script>
<div style="background-color:transparent;box-sizing:border-box;">
  <div class="bg-pattern" style="color:var(--text);font-family:'Urbanist',sans-serif;min-height:100%;">
    <div class="overlay" style="min-height:100%;">
      <div class="max-w-lg mx-auto px-6 py-12">
        <div style="text-align:center;margin-bottom:32px;">
          <div style="display:inline-flex;align-items:center;gap:10px;padding:6px 16px;border-radius:20px;background:var(--accent-soft);border:1px solid var(--accent);margin-bottom:20px;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--accent);">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
              <line x1="12" y1="19" x2="12" y2="23"/>
              <line x1="8" y1="23" x2="16" y2="23"/>
            </svg>
            <span style="font-size:12px;font-weight:600;color:var(--accent);letter-spacing:.05em;">PODCAST AO VIVO</span>
          </div>
          <h1 class="text-3xl font-bold mb-3" style="color:var(--text);letter-spacing:-0.02em;line-height:1.15;">
            Envie sua <span style="color:var(--accent);">pergunta</span>
          </h1>
          <p style="color:var(--muted);font-size:15px;line-height:1.6;">
            Sua pergunta poderá ser lida e respondida pelos entrevistadores durante o podcast
          </p>
        </div>
        <div class="rounded-2xl p-7" style="background:var(--card);border:1px solid var(--border);box-shadow:0 4px 20px rgba(0,0,0,.06);">
          <form id="questionForm">
            <div class="mb-4">
              <label style="display:block;font-size:14px;font-weight:600;color:var(--text);margin-bottom:8px;">Seu nome <span style="color:var(--muted);font-weight:400;">(opcional)</span></label>
              <input type="text" id="nameInput" placeholder="Como você quer ser chamado?" style="width:100%;padding:14px 16px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:16px;font-family:'Urbanist',sans-serif;transition:border-color .2s;" onfocus="this.style.borderColor='var(--accent)'" onblur="this.style.borderColor='var(--border)'">
            </div>
            <div class="mb-5">
              <label style="display:block;font-size:14px;font-weight:600;color:var(--text);margin-bottom:8px;">Sua pergunta</label>
              <textarea id="questionInput" rows="5" placeholder="Escreva aqui o que você quer perguntar..." required style="width:100%;padding:14px 16px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:16px;font-family:'Urbanist',sans-serif;resize:vertical;min-height:120px;transition:border-color .2s;" onfocus="this.style.borderColor='var(--accent)'" onblur="this.style.borderColor='var(--border)'"></textarea>
            </div>
            <button type="submit" id="submitBtn" class="btn-primary" style="width:100%;padding:16px 24px;border-radius:10px;background:var(--accent);color:#fff;border:none;font-size:16px;font-weight:700;cursor:pointer;font-family:'Urbanist',sans-serif;display:flex;align-items:center;justify-content:center;gap:10px;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="22" y1="2" x2="11" y2="13"/>
                <polygon points="22 2 15 22 11 13 2 9 22 2"/>
              </svg>
              Enviar pergunta
            </button>
          </form>
          <div id="successMsg" style="display:none;margin-top:16px;padding:14px 16px;border-radius:10px;background:rgba(13,150,105,.1);border:1px solid rgba(13,150,105,.3);color:#047857;font-size:14px;font-weight:600;text-align:center;align-items:center;justify-content:center;gap:8px;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
            Pergunta enviada com sucesso! Obrigado por participar!
          </div>
          <div id="errorMsg" style="display:none;margin-top:16px;padding:14px 16px;border-radius:10px;background:rgba(220,38,38,.1);border:1px solid rgba(220,38,38,.3);color:#dc2626;font-size:14px;font-weight:600;text-align:center;">
            Erro ao enviar. Tente novamente.
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
(function(){
  var API_URL = 'https://sheetdb.io/api/v1/ni8igfy3c7bqv';
  var form = document.getElementById('questionForm');
  var nameInput = document.getElementById('nameInput');
  var questionInput = document.getElementById('questionInput');
  var successMsg = document.getElementById('successMsg');
  var errorMsg = document.getElementById('errorMsg');
  var submitBtn = document.getElementById('submitBtn');

  function getTime(){
    var now = new Date();
    var h = now.getHours().toString().padStart(2,'0');
    var m = now.getMinutes().toString().padStart(2,'0');
    return h + ':' + m;
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    var text = questionInput.value.trim();
    if(!text) return;
    var name = nameInput.value.trim() || 'Anônimo';
    
    submitBtn.disabled = true;
    submitBtn.innerHTML = 'Enviando...';
    successMsg.style.display = 'none';
    errorMsg.style.display = 'none';

    fetch(API_URL, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        data: {
          nome: name,
          pergunta: text,
          horario: getTime(),
          selecionada: 'FALSE'
        }
      })
    })
    .then(function(r){ 
      if(r.ok) return r.json();
      throw new Error('Erro');
    })
    .then(function(){
      questionInput.value = '';
      nameInput.value = '';
      successMsg.style.display = 'flex';
      setTimeout(function(){ successMsg.style.display = 'none'; }, 4000);
    })
    .catch(function(){
      errorMsg.style.display = 'block';
      setTimeout(function(){ errorMsg.style.display = 'none'; }, 4000);
    })
    .finally(function(){
      submitBtn.disabled = false;
      submitBtn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg> Enviar pergunta';
    });
  });
})();
</script>
</html>
